# Put at /etc/nginx/sites-available/api.nearbnb.com, then:
#   ln -s /etc/nginx/sites-available/api.nearbnb.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.nearbnb.com        (adds the https part and the certificate by itself)
server {
    listen 80;
    server_name api.nearbnb.com;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
