# Production stack tuned for a 2 GB RAM server.
# Images are built elsewhere (local machine or CI) and pulled. Do NOT build on the server.
# Frontend is built to static files and served by nginx, so there is no node container.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file: .env
    command: >
      postgres
      -c shared_buffers=192MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 450m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 64m

  api:
    image: nearbnb-backend:latest
    restart: unless-stopped
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    volumes:
      - storage:/data/storage
    mem_limit: 300m
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: nearbnb-backend:latest
    restart: unless-stopped
    env_file: .env
    command: celery -A app.jobs.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - storage:/data/storage
    mem_limit: 250m
    depends_on:
      db:
        condition: service_healthy

  beat:
    image: nearbnb-backend:latest
    restart: unless-stopped
    env_file: .env
    command: celery -A app.jobs.celery_app beat --loglevel=info
    mem_limit: 120m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    mem_limit: 40m
    depends_on:
      - api

volumes:
  pgdata:
  storage:
