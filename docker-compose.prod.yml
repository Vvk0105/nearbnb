# Production stack tuned for a 2 GB RAM server (1 CPU).
# Images are built elsewhere (local machine or CI) and loaded on the server. Do NOT build on the server.
# The frontend is deployed separately (Vercel); this stack serves only the API at https://$API_DOMAIN.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file: .env
    command: >
      postgres
      -c shared_buffers=192MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 450m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: nearbnb-backend:latest
    restart: unless-stopped
    env_file: .env
    # Behind nginx (or Caddy) on this server only, so forwarded headers can be trusted (real client IP for rate limits).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=*
    # Reachable only from this server (the existing nginx proxies api.nearbnb.com to it), never from the internet directly.
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - storage:/data/storage
    mem_limit: 300m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: nearbnb-backend:latest
    restart: unless-stopped
    env_file: .env
    command: celery -A app.jobs.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - storage:/data/storage
    mem_limit: 250m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: nearbnb-backend:latest
    restart: unless-stopped
    env_file: .env
    command: celery -A app.jobs.celery_app beat --loglevel=info
    mem_limit: 120m
    depends_on:
      redis:
        condition: service_healthy

  # Only used when nothing else owns ports 80/443: docker compose --profile caddy up -d
  # On a server that already runs nginx, leave this off and use deploy/nginx-api.nearbnb.com.conf instead.
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.nearbnb.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 48m
    depends_on:
      - api

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
